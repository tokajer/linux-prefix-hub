[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-prefix-hub"
version = "0.3.0"
description = "Know where your Windows games on Linux store their saves -- and move those saves into your home folder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tokajer" }]
keywords = ["wine", "proton", "steam", "lutris", "heroic", "savegames"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]

# The core is dependency-free on purpose (own VDF/YAML readers, poll
# fallback, stdlib sqlite3). The extras improve the experience but are
# never required -- every consumer of them degrades to an honest message.
dependencies = []

[project.optional-dependencies]
# Self-update. Shipped inside the AppImage, which is the only build that can
# update itself; a pip install is updated by pip.
update = ["velopack>=1.2"]
# The graphical interface. Not pip-installable in practice -- PyGObject wants
# system GTK 4 and libadwaita, so distro packages are the sane route
# (Fedora/Nobara: python3-gobject gtk4 libadwaita).
gui = ["PyGObject>=3.50"]
# Recommended for daily use:
full = [
  "inotify_simple>=1.3",  # instant new-game detection instead of polling
  "vdf>=3.4",             # sturdier VDF parser, including binary VDFs
  "PyYAML>=6.0",          # full YAML instead of our Lutris-shaped subset
  "velopack>=1.2",        # self-update
]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/tokajer/linux-prefix-hub"
Issues = "https://github.com/tokajer/linux-prefix-hub/issues"

[project.scripts]
# Same multi-mode dispatcher as the AppImage. The short alias is there
# because nobody wants to type the long one twice.
linux-prefix-hub = "linux_prefix_hub.__main__:main"
prefixhub = "linux_prefix_hub.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linux_prefix_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

# Pinned explicitly so a developer's global ruff config cannot make the
# local run disagree with CI.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Discovery walks other programs' config files: one broken file must never
# take a scan down, so "except Exception: continue" is intentional here.
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
