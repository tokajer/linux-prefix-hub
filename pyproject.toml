[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deinapp"
version = "0.1.0"
description = "Wine/Proton-Prefix- und Speicherstand-Verwaltung mit Windows-Gefuehl"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Kern laeuft dependency-frei (eigener VDF-Parser, Poll-Fallback).
# Die Extras verbessern das Erlebnis, sind aber nicht Pflicht:
dependencies = []

[project.optional-dependencies]
# Empfohlen fuer Produktivbetrieb:
full = [
  "inotify_simple>=1.3",  # echter Watcher statt Poll
  "vdf>=3.4",             # robuster VDF-Parser inkl. binaer
]

[project.scripts]
# pipx/pip-Entrypoint. Ruft denselben Multi-Modus-Dispatcher wie das AppImage.
deinapp = "deinapp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deinapp"]
