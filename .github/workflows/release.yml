name: Release AppImage

# Two ways in, same job:
#
#   * Actions -> "Release AppImage" -> "Run workflow", type the tag
#     (v0.2.1). The tag does not have to exist -- it is created on the commit
#     the workflow runs against, together with the release.
#   * Or push a tag the usual way: git tag v0.2.1 && git push origin v0.2.1
#
# The job builds the AppImage and the Velopack update feed and publishes the
# whole output directory as a GitHub release. That release is what GearLever
# and our own `--update` pull from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.1 (created if it is new)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so a build can derive its own version

      # The tag *is* the version -- nothing in the source carries one that
      # could contradict it, so there is nothing left to check here. The
      # build stamps this number into the bundle and the smoke test below
      # reads it back out of the finished artifact.
      - name: Resolve version
        id: version
        env:
          # Typed into the form, so take it with or without the "v".
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            VERSION="${INPUT_TAG}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "${VERSION}" ]; then
            echo "No tag to release." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # vpk is a .NET tool: it builds the AppImage and the release feed that
      # core/updater.py reads.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install vpk
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build the Velopack release
        run: ./packaging/build-velopack.sh "${{ steps.version.outputs.version }}"

      - name: Smoke test the AppImage
        env:
          # Into the environment rather than inlined below: every line of a
          # `run: |` block has to stay indented, and a long ${{ }} expression
          # is what tempts you into a line continuation that silently ends
          # the YAML block scalar.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          APP="$(ls build/release/*.AppImage | head -n1)"
          chmod +x "$APP"
          # Runs in a throwaway HOME so the self-heal cannot touch the runner.
          BUILT="$(HOME="$(mktemp -d)" "$APP" --version | head -n1)"
          echo "$BUILT"
          # The artifact must report the tag it was built from: this is what
          # `--update` compares against, so a wrong number here means every
          # user is told they are up to date forever.
          case "$BUILT" in
            *" $VERSION") ;;
            *)
              echo "Built artifact says '$BUILT', tag says $VERSION." >&2
              exit 1
              ;;
          esac
          HOME="$(mktemp -d)" "$APP" --scan

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxPrefixHub-${{ steps.version.outputs.version }}-x86_64
          path: build/release/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --target creates the tag on this commit when it does not exist
          # yet, which is what makes the "Run workflow" form enough on its
          # own. A tag pushed by GITHUB_TOKEN does not start another run, so
          # this cannot loop back into the `push: tags` trigger above.
          #
          # The whole output directory is the update feed -- upload all of it,
          # not just the AppImage, or `--update` finds nothing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Linux Prefix Hub $VERSION" \
              --generate-notes \
              build/release/*
          fi
